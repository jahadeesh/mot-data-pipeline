[project]
name = "mot-data-pipeline"
version = "0.1.0"
description = "Download, clean and publish the DVSA anonymised MOT test dataset as partitioned parquet."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
mot-pipeline = "mot_pipeline.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mot_pipeline"]

# The SQL lives in a top-level sql/ folder so it is easy to read and review on GitHub.
# Wheels ship a copy inside the package; config.py looks there first, then at the repo root.
[tool.hatch.build.targets.wheel.force-include]
"sql" = "mot_pipeline/sql"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
